# Installed to share/orbbec_dual_sync/config/dual_sync.yaml after colcon build.
# Loaded by dual_sync_detect.launch.py via parameters=[config_path].
# Node names below must match the names= in the launch file.

orbbec_cam0_pub:
  ros__parameters:
    camera_index: 0
    frame_id: orbbec_cam0
    # Keep USB/DDS pressure below the cameras' practical frame rate.
    publish_rate_hz: 6.0
    publish_depth: true
    publish_camera_info: true
    # Raw per-camera USB window (optional). Leave false; UI is dual_view.
    show_preview: false
    # Launch also TimerAction-staggers cam1; keep 0 here for cam0.
    open_delay_s: 0.0
    color_topic: /orbbec/cam0/color/image_raw
    depth_topic: /orbbec/cam0/depth/image_raw
    info_topic: /orbbec/cam0/color/camera_info

orbbec_cam1_pub:
  ros__parameters:
    camera_index: 1
    frame_id: orbbec_cam1
    publish_rate_hz: 6.0
    publish_depth: true
    publish_camera_info: true
    # Raw per-camera USB window (optional). Leave false; UI is dual_view.
    show_preview: false
    # Backup stagger if launch TimerAction is bypassed (node started alone).
    open_delay_s: 0.0
    color_topic: /orbbec/cam1/color/image_raw
    depth_topic: /orbbec/cam1/depth/image_raw
    info_topic: /orbbec/cam1/color/camera_info

orbbec_dual_view:
  ros__parameters:
    cam0_color_topic: /orbbec/cam0/color/image_raw
    cam1_color_topic: /orbbec/cam1/color/image_raw
    max_height: 480
    refresh_hz: 15.0
    # Digital zoom toward cam0 image center (1.0 = full frame). Pose still uses full frame.
    cam0_zoom: 1.0
    # Same rack OPEN/CLOSED CV as orbbec_rack_overlay, on the cam1 pane.
    enable_rack_cv: true
    rack_json: ""
    state_mode: classify
    force_state: CLOSED
    classify_every_n: 2
    # YOLO arm boxes on both panes (robotics/arm_state/.../best.pt).
    enable_arm_cv: true
    arm_weights: ""
    arm_conf: 0.25
    arm_every_n: 3
    # Pale baby-blue HSV mask tracker (UR joint plastic; no neural net).
    enable_blue_cv: true
    blue_show_mask: true
    blue_min_area: 280
    blue_every_n: 1
    # Big red ERROR when a blue joint is within this 3D distance of black equipment.
    blue_proximity_mm: 100.0
    # OnlineCamPose: use live UR FK 3D joints + blue caps (incl. depth Kabsch) when tags fail.
    enable_ur_fk: true
    online_use_blue: true
    online_use_blue_in_pnp: true

orbbec_rack_overlay:
  ros__parameters:
    color_topic: /orbbec/cam1/color/image_raw
    # Empty -> robotics/rack_lid_state/rack.json via ORBBEC_CAMERA_ROOT.
    rack_json: ""
    show_preview: true
    # classify = JudgeAgent OPEN/CLOSED (default). Pin with force_open/force_closed.
    state_mode: classify
    force_state: CLOSED
    save_dir: ""
    save_every_n: 0
